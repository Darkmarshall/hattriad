name: Build ISO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y live-build qemu-system-x86 socat netpbm python3-pil fonts-dejavu-core
      - name: Generate splash frames
        run: python3 branding/make-splash.py config/includes.chroot/usr/share/plymouth/themes/hattriad
      - run: |
          lb config --distribution trixie \
            --archive-areas "main contrib non-free-firmware" \
            --debian-installer none \
            --bootappend-live "boot=live components quiet splash hostname=hattriad"
          mkdir -p config/includes.binary/isolinux
          python3 branding/make-bootsplash.py config/includes.binary/isolinux/splash.png
          lb build
          md5sum config/includes.binary/isolinux/splash.png binary/isolinux/splash.png || true
      - name: Boot test and screenshots
        continue-on-error: true
        run: |
          qemu-system-x86_64 -m 2048 -boot d -cdrom live-image-amd64.hybrid.iso \
            -display none -vga std \
            -monitor unix:/tmp/mon,server,nowait -daemonize
          sleep 20
          echo "sendkey ret" | socat - unix-connect:/tmp/mon
          for i in 1 2 3 4 5 6 7 8; do
            sleep 6
            echo "screendump /tmp/s$i.ppm" | socat - unix-connect:/tmp/mon
            sleep 1
            pnmtopng /tmp/s$i.ppm > splash-$i.png
          done
          sleep 150
          echo "screendump /tmp/shot.ppm" | socat - unix-connect:/tmp/mon
          sleep 2
          pnmtopng /tmp/shot.ppm > boot-screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots
          path: |
            boot-screenshot.png
            splash-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: hattriad-iso
          path: "*.iso"
